name: EAS Update (production)

# Publicacao para os testadores da Play Store. Normalmente roda apenas manualmente.
# O push abaixo e temporario para publicar esta correcao no canal production.

on:
  push:
    branches:
      - claude/eas-build-dependency-sync-gylm3i
  workflow_dispatch:
    inputs:
      message:
        description: 'Mensagem da atualizacao (aparece no historico do EAS)'
        required: false
        default: 'atualizacao'

jobs:
  update:
    name: Publicar no canal production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Testes
        run: npx jest --ci

      - name: Configurar EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publicar update
        env:
          UPDATE_MESSAGE: ${{ inputs.message || github.event.head_commit.message || 'polimento visual mobile e capsula mensal' }}
        run: eas update --channel production --environment production --message "$UPDATE_MESSAGE" --non-interactive
