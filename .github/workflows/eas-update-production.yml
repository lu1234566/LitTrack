name: EAS Update (production)

# Publicacao para os testadores da Play Store. So roda quando alguem manda —
# nunca sozinha, ao contrario do canal preview. Dispare pela aba Actions do
# GitHub (botao "Run workflow") ou peca ao Claude, que consegue dispara-la.
#
# Requer o secret EXPO_TOKEN no repositorio:
#   Settings > Secrets and variables > Actions > New repository secret

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Mensagem da atualizacao (aparece no historico do EAS)'
        required: false
        default: 'atualizacao'

jobs:
  update:
    name: Publicar no canal production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Nada quebrado chega ao aparelho dos testadores: se qualquer um destes
      # falhar, o job para antes de publicar.
      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Testes
        run: npx jest --ci

      - name: Configurar EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publicar update
        run: eas update --channel production --environment production --message "${{ inputs.message }}" --non-interactive
