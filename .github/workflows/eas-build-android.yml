name: EAS Build (Android)

# Gera o binario (.apk no perfil preview, .aab no production). Diferente dos
# workflows de update: aquele troca so o JavaScript, este reconstroi o app
# nativo — necessario quando mudam permissoes, nivel de API ou versao do SDK.
#
# So roda por disparo explicito. Um build consome cota da conta Expo e demora,
# entao nunca automatico.

on:
  # Apenas disparo explicito. Enquanto a branch padrao do repositorio for a
  # `main` (site antigo), o botao "Run workflow" e a API nao enxergam este
  # arquivo — nesse caso, religue o gatilho de push por um commit.
  workflow_dispatch:
    inputs:
      profile:
        description: 'Perfil do eas.json'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Se algo aqui falhar, o build nao comeca — economiza cota e evita subir
      # binario quebrado.
      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Testes
        run: npx jest --ci

      - name: Configurar EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --no-wait: o job termina apos enfileirar. O build em si roda nos
      # servidores da Expo e o link sai no log e no painel expo.dev.
      # Disparo por push nao carrega inputs — cai em preview, que e o perfil
      # seguro (APK de teste, nao vai para a loja).
      - name: Enfileirar build
        env:
          PROFILE: ${{ inputs.profile || 'preview' }}
        run: eas build --platform android --profile "$PROFILE" --non-interactive --no-wait
